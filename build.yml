name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archives = [
              p for p in Path(".").iterdir()
              if p.is_file() and zipfile.is_zipfile(p)
          ]
          if len(archives) != 1:
              raise SystemExit("Expected exactly one project ZIP")
          with zipfile.ZipFile(archives[0]) as z:
              z.extractall("source")
          if not Path("source/FloatingWindows/settings.gradle").exists():
              raise SystemExit("Wrong ZIP: project not found")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android app
        working-directory: source/FloatingWindows
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingWindows-APK
          path: source/FloatingWindows/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
